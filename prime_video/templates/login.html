```html
<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Sign in | Prime Video</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #00050d;
            color: #fff;
            font-family: Arial;
        }

        .box {
            width: min(400px, 90%);
            background: #18232f;
            padding: 32px;
            border-radius: 8px;
        }

        .brand {
            font-size: 26px;
            font-weight: bold;
        }

        .brand span {
            color: #00a8e1;
        }

        h1 {
            margin: 28px 0 20px;
        }

        form p {
            display: grid;
            gap: 7px;
            margin: 16px 0;
        }

        input {
            padding: 12px;
            border-radius: 4px;
            border: 1px solid #71808f;
            background: #fff;
            width: 100%;
        }

        button {
            width: 100%;
            padding: 13px;
            border: 0;
            border-radius: 4px;
            background: #00a8e1;
            font-weight: bold;
            margin-top: 8px;
        }

        a {
            color: #74c9e8;
        }
    </style>
</head>

<body>

    <main class="box">

        <div class="brand">
            prime <span>video</span>
        </div>

        <h1>Sign in</h1>

        <form method="post">
            {% csrf_token %}

            {{ form.as_p }}

            <button>
                Sign in
            </button>
        </form>

        <p>
            New to Prime Video?
            <a href="{% url 'signup' %}">
                Create an account
            </a>
        </p>

    </main>

</body>

</html>
```
